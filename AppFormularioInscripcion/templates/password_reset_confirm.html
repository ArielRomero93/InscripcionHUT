{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="{% static 'css/estilosResetPassword.css' %}"> <!-- Vincula tu archivo CSS -->
</head>
<body>
    <div class="container">
        <h2>Cambiar Contraseña</h2>

        <!-- Mostrar mensajes de error o éxito -->
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {% if message.tags %}{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}  <!-- Esto debería mostrar los campos del formulario -->
            <button type="submit">Cambiar Contraseña</button>
        </form>
    </div>
</body>
</html>
