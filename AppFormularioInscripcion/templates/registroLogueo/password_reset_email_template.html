<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer Contraseña</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px; /* Ancho máximo del contenedor */
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center; /* Centra el texto dentro del contenedor */
        }

        h2 {
            margin-bottom: 20px;
            color: #333; /* Color del título */
            font-size: 24px; /* Tamaño del texto */
        }

        p {
            margin-bottom: 15px; /* Espacio inferior entre párrafos */
            font-size: 16px; /* Tamaño de la fuente */
            color: #555; /* Color del texto */
        }

        a {
            color: #007bff; /* Color del enlace */
            text-decoration: none; /* Elimina el subrayado */
            font-weight: bold; /* Resalta el enlace */
        }

        a:hover {
            text-decoration: underline; /* Subraya el enlace al pasar el mouse */
            color: #0056b3; /* Cambia el color al pasar el mouse */
        }

        /* Estilos del pie de página */
        footer {
            margin-top: 20px; /* Espacio superior para el pie de página */
            font-size: 12px; /* Tamaño de fuente más pequeño */
            color: #aaa; /* Color del texto más claro */
        }

        /* Media Queries para responsive */
        @media (max-width: 480px) {
            .container {
                padding: 20px; /* Reduce el padding en pantallas pequeñas */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hola {{ nombre }}</h2>
        <p>Usa el siguiente enlace para restablecer tu contraseña:</p>
        <p><a href="{{ reset_url }}">{{ reset_url }}</a></p>
        <footer>
            Equipo Fronteras Argentina.
        </footer>
    </div>
</body>
</html>
