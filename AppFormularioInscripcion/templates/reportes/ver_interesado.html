{% extends 'home.html' %}
{% load static %}
{% block title %}Detalles del interesado{% endblock %}

{% block contenido %}
<div class="container">
    <h2>Detalles del interesado {{ interesado.nombre }}</h2>
    <form>
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" value="{{ interesado.nombre }}" readonly>
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" value="{{ interesado.apellido }}" readonly>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" value="{{ interesado.email }}" readonly>
        </div>

        <div class="form-group">
            <label for="profesionOcupacion">Estado Civil:</label>
            <input type="text" id="estadoCivil" value="{{ interesado.profesionOcupacion }}" readonly>
        </div>

        <div class="form-group">
            <label for="servicioElegido">Estado Civil:</label>
            <input type="text" id="estadoCivil" value="{{ interesado.servicioElegido }}" readonly>
        </div>

        <div class="form-group">
            <label for="fechaCreacion">Fecha de Creación:</label>
            <input type="text" id="fechaCreacion" value="{{ interesado.fecha_creacion|date:"d/m/Y H:i" }}" readonly>
        </div>

        <div class="form-group">
            <a href="{% url 'ReporteDecisiones' %}" class="btn btn-primary">Regresar</a>
        </div>
    </form>
</div>

<link rel="stylesheet" href="{% static 'css/estilosVerInscriptos.css' %}">

{% endblock %}
